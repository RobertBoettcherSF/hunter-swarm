  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = freq;
  o.type = "sine";
  g.gain.value = gain;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(gain, now);

function readReport() {
  const n = ada.hs_report_len();
  const bytes = new Uint8Array(n);
  for (let i = 0; i < n; i++) bytes[i] = ada.hs_report_byte(i + 1) & 255;
  return new TextDecoder().decode(bytes);
}
function writeText(setLen, setChar, text, max) {
  const bytes = new TextEncoder().encode(text).slice(0, max);
  setLen(bytes.length);
  for (let i = 0; i < bytes.length; i++) setChar(i + 1, bytes[i]);
}
function env() {

}
function finishReport(which, testKey) {

  ada.hs_set_test_key(testKey);
  ada.hs_build_report(which);
  const raw = readReport();
  let obj;
  try { obj = JSON.parse(raw); }
  catch (e) { return raw; }
  obj.environment = Object.assign(obj.environment || {}, env());
  obj.stamp = STAMP;

}
function fileName(side) {

}
function download(name, text) {

}

function onTrap(err) {

    if (!obj.errors || !obj.errors.length) obj.errors = [{kind: "trap", file: "js", line: 0}];
    obj.errors[0].detail = String(err);
    text = JSON.stringify(obj, null, 1);
  } catch (e) {
    text = JSON.stringify({schema: "hunter-swarm-report", schema_version: "v1", stamp: STAMP, seeds: {grid: seedOf(grid), eater: seedOf(eater), ghosts: seedOf(ghosts)}, test_key: "crash", expected: "", action_log: [], state_hash: "", events: [], events_dropped: 0, errors: [{kind: "trap", file: "js", line: 0, detail: String(err)}], environment: env(), custom: {side: "crash"}}, null, 1);

const SPEED = [{every: 6, burst: 1}, {every: 3, burst: 1}, {every: 1, burst: 1}, {every: 1, burst: 4}];
const OUTCOME = ["running", "won", "lost", "timed_out"];
function stepGame() {
  const sp = SPEED[Number(speed.value)] || SPEED[0];
  frameN += 1;
  if (!running) return;
  if (frameN % sp.every !== 0) return;
  let heard = false;
  for (let n = 0; n < sp.burst; n++) {
    const before = ada.hs_score();
    const pellets = ada.hs_pellets();
    const lives = ada.hs_lives();
    let oc;
    try { oc = ada.hs_tick(); }
    catch (err) { onTrap(err); running = false; return; }
    if (!heard) {
      if (ada.hs_lives() < lives) { beep(160, 0.16, 0.05); heard = true; }
      else if (ada.hs_score() - before >= 50 && ada.hs_pellets() < pellets) { beep(520, 0.07, 0.03); heard = true; }
      else if (ada.hs_score() - before >= 200) { beep(740, 0.06, 0.04); heard = true; }
    }
    if (oc !== 0) {
      running = false;
      ended = true;
      if (oc === 1) beep(660, 0.12, 0.04);
      else beep(140, 0.2, 0.05);
      savePair(2);
      return;
    }
  }
}

const ctx = view.getContext("2d");
function layout() {
  const cell = Math.max(8, Math.min(28, Math.floor((Math.min(innerWidth, 820) - 16) / ada.hs_width())));
  const cssW = cell * ada.hs_width();
  const cssH = cell * ada.hs_height();
  view.style.width = cssW + "px";
  view.style.height = cssH + "px";
  const dpr = Math.min(2, devicePixelRatio || 1);
  view.width = Math.floor(cssW * dpr);
  view.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return cell;
}
function poly(points) {
  ctx.beginPath();
  ctx.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
  ctx.closePath();

      const px = x * cell, py = y * cell;
      if (tile === 0) {
        ctx.fillStyle = "#2a3548";
        ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
      } else if (tile === 2) {
        ctx.fillStyle = "#d7e3f4";

      } else if (tile === 3) {

      } else if (tile === 4) {

        ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
      }

    const y = ada.hs_ghost_y(id) * cell + cell / 2;
    const mode = ada.hs_ghost_mode(id);

    ctx.fillStyle = mode === 3 ? "#d9d3c5" : COLORS[id - 1];

  ctx.fill();
  ctx.fillStyle = "#1a1e28";
  ctx.fillRect(ex + cell * 0.32, ey + cell * 0.32, cell * 0.1, cell * 0.1);
  ctx.fillRect(ex + cell * 0.56, ey + cell * 0.32, cell * 0.1, cell * 0.1);
  ctx.fillStyle = "#c4491d";
  poly([ex + cell * 0.5 + dx * cell * 0.28, ey + cell * 0.62 + dy * cell * 0.28,
        ex + cell * 0.38 + dx * cell * 0.08, ey + cell * 0.74 + dy * cell * 0.08,
        ex + cell * 0.62 + dx * cell * 0.08, ey + cell * 0.74 + dy * cell * 0.08]);

  const code = ada.hs_decision(0);
  const key = DECISION_KEYS[code] || "none";
  const word = ended ? t(OUTCOME[oc] || "ready") : paused ? t("paused") : running ? t("running") : t("ready");
  status.textContent = t("score") + " " + ada.hs_score()
    + " · " + t("lives") + " " + ada.hs_lives()
    + " · " + t("pellets") + " " + ada.hs_pellets()
    + " · " + t("tick") + " " + ada.hs_tick_count()
    + " · " + word
    + " · " + t(key === "ready" ? "ready_d" : key);

}

  const labels = ["danger_radius", "power_seek", "threat_range", "hunt_range", "cutoff_lead", "role_interval", "fright_ticks", "starve_ticks", "ghost_stride"];
  for (let i = 1; i <= n; i++) {

    input.addEventListener("change", () => {
      const ok = ada.hs_set_param(i, Number(input.value) | 0);
      input.value = String(ada.hs_param(i));

    input.value = String(ada.hs_param(i));

    box.appendChild(lab);
  }
}

const imports = {
  env: new Proxy({
    hs_host_crash(addr, line) {
      let file = "";
      try {
        const mem = new Uint8Array(ada.memory.buffer);
        for (let i = addr; addr && i < mem.length && mem[i] && file.length < 160; i++) file += String.fromCharCode(mem[i]);
      } catch (e) { file = ""; }
      let text;
      try {
        text = finishReport(3, 3);
        const obj = JSON.parse(text);
        if (obj.errors) obj.errors.forEach(err => { if (!err.file) err.file = file || "unknown"; });
        text = JSON.stringify(obj, null, 1);
      } catch (e) {
        text = String(e);
      }
      showCrash(text);
      download(fileName("crash"), text);
      throw new Error("last chance " + file + ":" + line);
    }
  }, {
    get(target, prop) {
      if (prop in target) return target[prop];
      return (...args) => {
        unknownImports.push(String(prop));
        console.warn("unknown wasm import", prop, args);
        return 0;
      };
    }
  })
};
