  "en-GB": '<svg class="flag" viewBox="0 0 60 36" aria-hidden="true"><rect width="60" height="36" fill="#012169"/><path d="M0 0 L60 36 M60 0 L0 36" stroke="#fff" stroke-width="8"/><path d="M0 0 L60 36 M60 0 L0 36" stroke="#C8102E" stroke-width="4"/><path d="M30 0 V36 M0 18 H60" stroke="#fff" stroke-width="14"/><path d="M30 0 V36 M0 18 H60" stroke="#C8102E" stroke-width="8"/></svg>',
  de: '<svg class="flag" viewBox="0 0 60 36" aria-hidden="true"><rect width="60" height="12" fill="#000"/><rect y="12" width="60" height="12" fill="#DD0000"/><rect y="24" width="60" height="12" fill="#FFCE00"/></svg>',
  es: '<svg class="flag" viewBox="0 0 60 36" aria-hidden="true"><rect width="60" height="36" fill="#C60B1E"/><rect y="9" width="60" height="18" fill="#FFC400"/></svg>',
  fr: '<svg class="flag" viewBox="0 0 60 36" aria-hidden="true"><rect width="20" height="36" fill="#0055A4"/><rect x="20" width="20" height="36" fill="#fff"/><rect x="40" width="20" height="36" fill="#EF4135"/></svg>'
};
let lang = localStorage.getItem("hs.lang") || "en-GB";
if (!STR[lang]) lang = "en-GB";
let soundOn = localStorage.getItem("hs.sound") !== "0";
let ada, running = false, paused = false, ended = false, startedKey = "";
let frameN = 0, fatal = false, crashSaved = false, audioCtx = null;
const unknownImports = [];
const store = sessionStorage;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function t(key) { return (STR[lang] && STR[lang][key]) || STR["en-GB"][key] || key; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.title = t("title");

  sound.setAttribute("aria-pressed", soundOn ? "true" : "false");

}
function flagButton(code, label) {

}
[["en-GB", "English"], ["de", "Deutsch"], ["es", "Español"], ["fr", "Français"]].forEach(([c, n]) => langs.appendChild(flagButton(c, n)));

function unlock() {
  if (!audioCtx) audioCtx = new AudioContext();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function beep(freq, dur, gain) {
  if (!soundOn || !audioCtx || document.hidden) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = freq;
  o.type = "sine";
  g.gain.value = gain;
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  g.gain.setValueAtTime(gain, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.start(now); o.stop(now + dur);
}
sound.addEventListener("click", () => {
  unlock();
  soundOn = !soundOn;
  localStorage.setItem("hs.sound", soundOn ? "1" : "0");
  applyLang();
});
addEventListener("pointerdown", unlock, {once: false});
document.addEventListener("visibilitychange", () => { if (document.hidden && audioCtx) audioCtx.suspend(); });

function seedOf(el) {
  const n = Number(el.value);
  if (!Number.isFinite(n) || n < 0) return 1;
  return n >>> 0;
}
function newSeeds() {
  const a = new Uint32Array(3);
  crypto.getRandomValues(a);
  grid.value = String(a[0]);
  eater.value = String(a[1]);
  ghosts.value = String(a[2]);
}
function rememberSeeds() {
  sessionStorage.setItem("hs.seeds", grid.value + "," + eater.value + "," + ghosts.value);
}
newseeds.addEventListener("click", () => { newSeeds(); rememberSeeds(); });
{
  const savedSeeds = sessionStorage.getItem("hs.seeds");
  if (savedSeeds) {
    const parts = savedSeeds.split(",");
    if (parts.length === 3) {
      grid.value = parts[0];
      eater.value = parts[1];
      ghosts.value = parts[2];
    }
  } else {
    newSeeds();
    rememberSeeds();
  }
}
grid.addEventListener("change", rememberSeeds);
eater.addEventListener("change", rememberSeeds);
ghosts.addEventListener("change", rememberSeeds);

function readReport() {
  const n = ada.hs_report_len();
  const bytes = new Uint8Array(n);
  for (let i = 0; i < n; i++) bytes[i] = ada.hs_report_byte(i + 1) & 255;
  return new TextDecoder().decode(bytes);
}
function writeText(setLen, setChar, text, max) {
  const bytes = new TextEncoder().encode(text).slice(0, max);
  setLen(bytes.length);
  for (let i = 0; i < bytes.length; i++) setChar(i + 1, bytes[i]);
}
function env() {
  return {
    browser: navigator.userAgent,
    language: lang,
    viewport: [innerWidth, innerHeight],
    reduced_motion: reduced,
    sound: soundOn,
    unknown_imports: unknownImports.slice()
  };
}
function finishReport(which, testKey) {
  writeText(ada.hs_set_stamp_len, ada.hs_set_stamp_char, STAMP, 80);
  ada.hs_set_test_key(testKey);
  ada.hs_build_report(which);
  const raw = readReport();
  let obj;
  try { obj = JSON.parse(raw); }
  catch (e) { return raw; }
  obj.environment = Object.assign(obj.environment || {}, env());
  obj.stamp = STAMP;
  return JSON.stringify(obj, null, 1);
}
function fileName(side) {
  const safe = STAMP.replace(/[^A-Za-z0-9._-]+/g, "_");
  return "hunter-swarm-" + side + "-g" + seedOf(grid) + "-e" + seedOf(eater) + "-h" + seedOf(ghosts) + "-t" + ada.hs_tick_count() + "-" + safe + ".json";
}
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "application/json"}));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
let lastEater = "", lastGhosts = "";
function savePair(testKey) {
  lastEater = finishReport(0, testKey);
  lastGhosts = finishReport(1, testKey);
  download(fileName("eater"), lastEater);
  download(fileName("ghosts"), lastGhosts);
  saved.innerHTML = "";
  const e = document.createElement("button");
  e.type = "button";
  e.textContent = fileName("eater");
  e.addEventListener("click", () => download(e.textContent, lastEater));
  const g = document.createElement("button");
  g.type = "button";
  g.textContent = fileName("ghosts");
  g.addEventListener("click", () => download(g.textContent, lastGhosts));
  saved.append(e, document.createTextNode(" "), g);
}
function showCrash(text) {
  fatal = true;
  crashSaved = true;
  store.setItem("hs.crash", text);
  crash.hidden = false;
  crashdl.onclick = () => download(fileName("crash"), text);
}

const crashedBefore = store.getItem("hs.clean") === "0";
store.setItem("hs.clean", "0");
addEventListener("pagehide", () => { if (!fatal) store.setItem("hs.clean", "1"); });
if (crashedBefore) {
  crash.hidden = false;
  const savedCrash = store.getItem("hs.crash") || "";
  crashdl.onclick = () => download("hunter-swarm-crash-" + STAMP.replace(/[^A-Za-z0-9._-]+/g, "_") + ".json", savedCrash || "{}");
}
crashhide.addEventListener("click", () => { crash.hidden = true; });

function onTrap(err) {
  if (crashSaved) return;
  let text;
  try {
    text = finishReport(3, 3);
    const obj = JSON.parse(text);
    if (!obj.errors || !obj.errors.length) obj.errors = [{kind: "trap", file: "js", line: 0}];
    obj.errors[0].detail = String(err);
    text = JSON.stringify(obj, null, 1);
  } catch (e) {
    text = JSON.stringify({schema: "hunter-swarm-report", schema_version: "v1", stamp: STAMP, seeds: {grid: seedOf(grid), eater: seedOf(eater), ghosts: seedOf(ghosts)}, test_key: "crash", expected: "", action_log: [], state_hash: "", events: [], events_dropped: 0, errors: [{kind: "trap", file: "js", line: 0, detail: String(err)}], environment: env(), custom: {side: "crash"}}, null, 1);
  }
  showCrash(text);
  download(fileName("crash"), text);
}

function begin() {
  ada.hs_start(seedOf(grid), seedOf(eater), seedOf(ghosts));
  startedKey = seedOf(grid) + ":" + seedOf(eater) + ":" + seedOf(ghosts);
  ended = false;
  paused = false;
}
function onStart() {
  unlock();
  const key = seedOf(grid) + ":" + seedOf(eater) + ":" + seedOf(ghosts);
  if (!startedKey || ended || key !== startedKey) begin();
  running = true;
  paused = false;
  beep(440, 0.05, 0.03);
}
function onStop() {
  if (!startedKey) return;
  running = false;
  paused = true;
  savePair(1);
  beep(220, 0.08, 0.03);
}
function onReset() {
  running = false;
  paused = false;
  begin();
  draw();
}
start.addEventListener("click", onStart);
stop.addEventListener("click", onStop);
reset.addEventListener("click", onReset);

function openDebug() {
  running = false;
  paused = true;
  expectBox.hidden = false;
  expected.focus();
}
debug.addEventListener("click", openDebug);
addEventListener("keydown", ev => {
  if (ev.key !== "F9") return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(ev.target.tagName)) return;
  ev.preventDefault();
  openDebug();
});
expected.addEventListener("input", () => { expectgo.disabled = expected.value.trim().length === 0; });
expectgo.disabled = true;
expectgo.addEventListener("click", () => {
  writeText(ada.hs_set_expected_len, ada.hs_set_expected_char, expected.value.trim(), 160);
  const text = finishReport(2, 0);
  download(fileName("f9"), text);
});

const SPEED = [{every: 6, burst: 1}, {every: 3, burst: 1}, {every: 1, burst: 1}, {every: 1, burst: 4}];
const OUTCOME = ["running", "won", "lost", "timed_out"];
function stepGame() {
  const sp = SPEED[Number(speed.value)] || SPEED[0];
  frameN += 1;
  if (!running) return;
  if (frameN % sp.every !== 0) return;
  let heard = false;
  for (let n = 0; n < sp.burst; n++) {
    const before = ada.hs_score();
    const pellets = ada.hs_pellets();
    const lives = ada.hs_lives();
    let oc;
    try { oc = ada.hs_tick(); }
    catch (err) { onTrap(err); running = false; return; }
    if (!heard) {
      if (ada.hs_lives() < lives) { beep(160, 0.16, 0.05); heard = true; }
      else if (ada.hs_score() - before >= 50 && ada.hs_pellets() < pellets) { beep(520, 0.07, 0.03); heard = true; }
      else if (ada.hs_score() - before >= 200) { beep(740, 0.06, 0.04); heard = true; }
    }
    if (oc !== 0) {
      running = false;
      ended = true;
      if (oc === 1) beep(660, 0.12, 0.04);
      else beep(140, 0.2, 0.05);
      savePair(2);
      return;
    }
  }
}

const ctx = view.getContext("2d");
function layout() {
  const cell = Math.max(8, Math.min(28, Math.floor((Math.min(innerWidth, 820) - 16) / ada.hs_width())));
  const cssW = cell * ada.hs_width();
  const cssH = cell * ada.hs_height();
  view.style.width = cssW + "px";
  view.style.height = cssH + "px";
  const dpr = Math.min(2, devicePixelRatio || 1);
  view.width = Math.floor(cssW * dpr);
  view.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return cell;
}
function poly(points) {
  ctx.beginPath();
  ctx.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) ctx.lineTo(points[i], points[i + 1]);
  ctx.closePath();
  ctx.fill();
}
function draw() {
  if (!ada) return;
  const cell = layout();
  const W = ada.hs_width(), H = ada.hs_height();
  ctx.clearRect(0, 0, cell * W, cell * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const tile = ada.hs_tile(x, y);
      const px = x * cell, py = y * cell;
      if (tile === 0) {
        ctx.fillStyle = "#2a3548";
        ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
      } else if (tile === 2) {
        ctx.fillStyle = "#d7e3f4";
        ctx.fillRect(px + cell * 0.38, py + cell * 0.38, cell * 0.24, cell * 0.24);
      } else if (tile === 3) {
        ctx.fillStyle = "#f07167";
        poly([px + cell / 2, py + cell * 0.22, px + cell * 0.78, py + cell / 2, px + cell / 2, py + cell * 0.78, px + cell * 0.22, py + cell / 2]);
      }
    }
  }
  for (let id = 1; id <= 4; id++) {
    const x = ada.hs_ghost_x(id) * cell + cell / 2;
    const y = ada.hs_ghost_y(id) * cell + cell / 2;
    const mode = ada.hs_ghost_mode(id);
    const r = cell * 0.34;
    ctx.fillStyle = mode === 3 ? "#d9d3c5" : COLORS[id - 1];
    if (mode === 4) {
      ctx.strokeStyle = COLORS[id - 1];
      ctx.lineWidth = 2;
      ctx.strokeRect(x - r * 0.45, y - r * 0.45, r * 0.9, r * 0.9);
      continue;
    }
    if (id === 1) poly([x, y - r, x + r, y, x, y + r, x - r, y]);
    else if (id === 2) poly([x, y - r, x + r, y + r * 0.8, x - r, y + r * 0.8]);
    else if (id === 3) poly([x, y - r, x + r * 0.86, y - r * 0.4, x + r * 0.86, y + r * 0.4, x, y + r, x - r * 0.86, y + r * 0.4, x - r * 0.86, y - r * 0.4]);
    else {
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.fillStyle = "#1a1e28";
      ctx.fillRect(x - r * 0.45, y - r * 0.45, r * 0.9, r * 0.9);
    }
  }
  const ex = ada.hs_eater_x() * cell, ey = ada.hs_eater_y() * cell;
  const dx = ada.hs_eater_dx(), dy = ada.hs_eater_dy();
  ctx.fillStyle = "#f4d35e";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(ex + cell * 0.16, ey + cell * 0.16, cell * 0.68, cell * 0.68, cell * 0.16);
  else ctx.rect(ex + cell * 0.16, ey + cell * 0.16, cell * 0.68, cell * 0.68);
  ctx.fill();
  ctx.fillStyle = "#1a1e28";
  ctx.fillRect(ex + cell * 0.32, ey + cell * 0.32, cell * 0.1, cell * 0.1);
  ctx.fillRect(ex + cell * 0.56, ey + cell * 0.32, cell * 0.1, cell * 0.1);
  ctx.fillStyle = "#c4491d";
  poly([ex + cell * 0.5 + dx * cell * 0.28, ey + cell * 0.62 + dy * cell * 0.28,
        ex + cell * 0.38 + dx * cell * 0.08, ey + cell * 0.74 + dy * cell * 0.08,
        ex + cell * 0.62 + dx * cell * 0.08, ey + cell * 0.74 + dy * cell * 0.08]);
  const oc = ada.hs_outcome();
  const code = ada.hs_decision(0);
  const key = DECISION_KEYS[code] || "none";
  const word = ended ? t(OUTCOME[oc] || "ready") : paused ? t("paused") : running ? t("running") : t("ready");
  status.textContent = t("score") + " " + ada.hs_score()
    + " · " + t("lives") + " " + ada.hs_lives()
    + " · " + t("pellets") + " " + ada.hs_pellets()
    + " · " + t("tick") + " " + ada.hs_tick_count()
    + " · " + word
    + " · " + t(key === "ready" ? "ready_d" : key);
  legend.textContent = NAMES.map((n, i) => n).join(" · ");
}
function frame() {
  stepGame();
  draw();
  requestAnimationFrame(frame);
}
addEventListener("resize", draw);

function loadParams() {
  const savedP = JSON.parse(localStorage.getItem("hs.params") || "null");
  const box = params;
  box.innerHTML = "";
  const n = ada.hs_param_count();
  const labels = ["danger_radius", "power_seek", "threat_range", "hunt_range", "cutoff_lead", "role_interval", "fright_ticks", "starve_ticks", "ghost_stride"];
  for (let i = 1; i <= n; i++) {
    const lab = document.createElement("label");
    const span = document.createElement("span");
    span.textContent = labels[i - 1] || ("p" + i);
    const input = document.createElement("input");
    input.type = "number";
    input.min = String(ada.hs_param_min(i));
    input.max = String(ada.hs_param_max(i));
    input.value = String((savedP && savedP[i]) || ada.hs_param(i));
    input.addEventListener("change", () => {
      const ok = ada.hs_set_param(i, Number(input.value) | 0);
      input.value = String(ada.hs_param(i));
      if (!ok) input.style.outline = "2px solid #c45c4a";
      else input.style.outline = "";
      const all = {};
      for (let k = 1; k <= n; k++) all[k] = ada.hs_param(k);
      localStorage.setItem("hs.params", JSON.stringify(all));
    });
    if (savedP && savedP[i] != null) ada.hs_set_param(i, Number(savedP[i]) | 0);
    input.value = String(ada.hs_param(i));
    lab.append(span, input);
    box.appendChild(lab);
  }
}

fetch("version.txt", {cache: "no-store"}).then(r => r.ok ? r.text() : "").then(text => {
  const got = text.trim();

}).catch(() => {});
if (location.protocol.startsWith("http")) {
  fetch("https://raw.githubusercontent.com/RobertBoettcherSF/hunter-swarm/main/docs/version.txt", {cache: "no-store"})
    .then(r => r.ok ? r.text() : "")
    .then(text => { if (text.trim() && text.trim() !== STAMP) stale.hidden = false; })
    .catch(() => {});
}

const imports = {
  env: new Proxy({
    hs_host_crash(addr, line) {
      let file = "";
      try {
        const mem = new Uint8Array(ada.memory.buffer);
        for (let i = addr; addr && i < mem.length && mem[i] && file.length < 160; i++) file += String.fromCharCode(mem[i]);
      } catch (e) { file = ""; }
      let text;
      try {
        text = finishReport(3, 3);
        const obj = JSON.parse(text);
        if (obj.errors) obj.errors.forEach(err => { if (!err.file) err.file = file || "unknown"; });
        text = JSON.stringify(obj, null, 1);
      } catch (e) {
        text = String(e);
      }
      showCrash(text);
      download(fileName("crash"), text);
      throw new Error("last chance " + file + ":" + line);
    }
  }, {
    get(target, prop) {
      if (prop in target) return target[prop];
      return (...args) => {
        unknownImports.push(String(prop));
        console.warn("unknown wasm import", prop, args);
        return 0;
      };
    }
  })
};

WebAssembly.instantiate(Uint8Array.from(atob(WASM), c => c.charCodeAt(0)), imports).then(obj => {
  ada = obj.instance.exports;
  loadParams();
  begin();
  applyLang();
  requestAnimationFrame(frame);
}).catch(err => { onTrap(err); status.textContent = String(err); });
applyLang();
